{% extends 'base.html' %}{% block title %}Triage Result{% endblock %}{% block content %}<div class="card"><h1>Triage Result</h1><span class="badge {{priority.split()[0].lower()}}">{{priority}}</span><p><b>Symptom:</b> {{symptom}}</p><p>{{message}}</p>{% if description %}<p><b>Description:</b> {{description}}</p>{% endif %}<a class="btn" href="{{url_for('book_appointment')}}">Book Consultation</a> <a class="btn light" href="{{url_for('patient_records')}}">View Digital Records</a></div>{% endblock %}
