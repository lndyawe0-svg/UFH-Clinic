{% extends 'base.html' %}{% block title %}Digital Triage{% endblock %}{% block content %}<div class="card"><h1>Digital Triage</h1><p class="muted">Triage only prioritises attention. It does not diagnose illness.</p><form method="post"><div class="row"><div><label>Age</label><input type="number" min="0" max="120" name="age" required></div><div><label>Main symptom</label><input name="symptom" placeholder="e.g. fever, chest pain" required></div></div><div class="row"><div><label>Duration</label><input name="duration" placeholder="e.g. 2 days" required></div><div><label>Severity</label><select name="severity" required><option value="mild">Mild</option><option value="moderate">Moderate</option><option value="severe">Severe</option></select></div></div><label>Description</label><textarea name="description"></textarea><button>Submit Triage</button></form></div>{% endblock %}
