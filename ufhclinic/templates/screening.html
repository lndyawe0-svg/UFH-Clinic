{% extends 'base.html' %}{% block title %}Health Screening{% endblock %}{% block content %}<div class="card"><h1>Health Screening</h1><p class="muted">Enter measurements taken by the clinic or provided during a supervised screening. Clinical interpretation must be done by a nurse.</p><form method="post"><div class="row"><div><label>BP systolic (mmHg)</label><input type="number" name="bp_systolic"></div><div><label>BP diastolic (mmHg)</label><input type="number" name="bp_diastolic"></div></div><div class="row"><div><label>Blood glucose (mmol/L)</label><input type="number" step="0.1" name="glucose"></div><div><label>Temperature (°C)</label><input type="number" step="0.1" name="temperature"></div></div><div class="row"><div><label>HIV test status</label><select name="hiv_test"><option>Not done</option><option>Negative</option><option>Positive</option><option>Indeterminate</option><option>Declined</option></select></div><div><label>Confidential HIV notes</label><input name="hiv_notes"></div></div><button>Save Screening</button></form></div>{% endblock %}
